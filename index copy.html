<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="index.css" />
    <title>Count Down to Next Year - by Ajayi Temitope (Topsite)</title>
    <link rel="shortcut icon" href="tree_animated.gif" type="image/x-icon" />
  </head>
  <body>
    <div class="main">
      <div style="width: 100%">
        Current Time - <span id="tmonth"></span> <span id="tday"></span>,
        <strong id="tyear"></strong>

        <p id="time"></p>
        <p id="current" style="display: none"></p>
        <p id="demo"></p>
        <marquee behavior="alternate">
          <span id="days-msg" style="display: none">
            (Less than <strong id="days"></strong>) to New Year
          </span>
          <script>
            (function () {
              function update() {
                var daysEl = document.getElementById("days");
                var msg = document.getElementById("days-msg");
                if (!daysEl || !msg) return;
                var val = parseInt(daysEl.textContent, 10);
                msg.style.display = !isNaN(val) && val > 1 ? "" : "none";
              }
              update();
              // observe changes to #days
              function attachObserver() {
                var target = document.getElementById("days");
                if (!target) return;
                new MutationObserver(update).observe(target, {
                  childList: true,
                  characterData: true,
                  subtree: true,
                });
              }
              attachObserver();
              // fallback: poll until #days exists
              var poll = setInterval(function () {
                if (document.getElementById("days")) {
                  attachObserver();
                  update();
                  clearInterval(poll);
                }
              }, 200);
            })();
          </script>
          <strong id="nyear"></strong
        ></marquee>
        <img src="tree_animated.gif" alt="" class="left" />
        <img src="tree_animated.gif" alt="" class="right" />
        <div class="credit">
          <b>Designed and Managed by:</b>
          <a href="https://topsite.com.ng" target="_blank">Topsite</a>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
